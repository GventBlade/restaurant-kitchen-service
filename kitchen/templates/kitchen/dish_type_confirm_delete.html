{% extends 'base.html' %}
{% load crispy_forms_filters %}
{% load crispy_forms_tags %}

{% block title %}Delete Dish Type{% endblock %}

{% block content %}
    <h1>Delete Dish Type</h1>
    <p>Are you sure you want to delete the dish type: <strong>{{ dishtype }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-3">
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'kitchen:dish-type-list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
{% endblock %}
