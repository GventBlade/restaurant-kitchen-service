{% extends "base.html" %}

{% block title %}Confirm Delete Dish{% endblock %}

{% block content %}
    <h1>Confirm Deletion</h1>
    <p>Are you sure you want to delete the dish: <strong>{{ dish.name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{{ dish.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
